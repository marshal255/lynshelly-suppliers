  </head>

  <body>
    <div id="root"></div>
    <script>
      const removeFooterTagline = () => {
        document.querySelectorAll("*").forEach((element) => {
          if (element.childElementCount === 0 && element.textContent.trim() === "Built with excellence in Kenya") {
            element.remove();
          }
          if (element.childElementCount === 0 && element.textContent.trim() === "© 2026 Lynshelly Supplies Ltd. All rights reserved.") {
            element.style.position = "absolute";
            element.style.left = "50%";
            element.style.transform = "translateX(-50%)";
            element.style.width = "max-content";
            element.parentElement.style.position = "relative";
            element.parentElement.style.width = "100%";
            const footerControls = [...element.parentElement.children].find((child) => child !== element);
            if (footerControls) {
              footerControls.style.marginLeft = "auto";
            }
          }
        });
        const serviceNames = new Set([
          "Stationery & Office Supplies",
          "ICT & Electronic Equipment",
          "Office Furniture & Fittings",
          "Construction Materials",
          "Laboratory Equipment",
          "Food Supplies",
          "Electrical & Plumbing"
        ]);
        document.querySelectorAll("li").forEach((item) => {
          if (serviceNames.has(item.textContent.trim()) && !item.dataset.serviceLink) {
            item.dataset.serviceLink = "true";
            item.tabIndex = 0;
            item.setAttribute("role", "link");
            item.style.cursor = "pointer";
            const goToServices = () => document.querySelector("#services")?.scrollIntoView({ behavior: "smooth" });
            item.addEventListener("click", goToServices);
            item.addEventListener("keydown", (event) => {
              if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                goToServices();
              }
            });
          }
        });
      };
      new MutationObserver(removeFooterTagline).observe(document.body, { childList: true, subtree: true });
      removeFooterTagline();
    </script>
  </body>
</html>
